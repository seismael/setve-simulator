version: '3.8'

services:
  # -------------------------------------------------------------
  # SETVE Simulation Master Orchestrator
  # -------------------------------------------------------------
  setve-orchestrator:
    build:
      context: ../../
      dockerfile: deployments/docker/Dockerfile
    container_name: setve-orchestrator
    command: ["python", "usecases/usecase_03_prometheus_monitoring.py", "--duration", "60", "--port", "9100"]
    ports:
      - "9100:9100"    # Prometheus telemetry endpoint
      - "50051:50051"  # gRPC barrier synchronization
    environment:
      - PYTHONUNBUFFERED=1
      - SETVE_S3_ENDPOINT=http://minio:9000
      - SETVE_S3_ACCESS_KEY=minioadmin
      - SETVE_S3_SECRET_KEY=minioadmin
      - SETVE_S3_BUCKET=setve-bucket
    cap_add:
      - SYS_NICE       # Permits core affinity pinning (os.sched_setaffinity)
      - SYS_ADMIN      # Direct I/O and page cache alignment
    shm_size: '2gb'
    volumes:
      - setve-data:/data
    depends_on:
      minio-create-bucket:
        condition: service_completed_successfully
    networks:
      - setve-net

  # -------------------------------------------------------------
  # Local High-Performance S3 Mock Storage Target (MinIO)
  # -------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-03-30T09-41-56Z
    container_name: setve-minio
    ports:
      - "9000:9000"    # S3 API
      - "9001:9001"    # MinIO Web Console
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    networks:
      - setve-net

  minio-create-bucket:
    image: minio/mc:RELEASE.2024-03-30T15-28-56Z
    container_name: setve-minio-setup
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until /usr/bin/mc config host add localminio http://minio:9000 minioadmin minioadmin; do
        echo 'Waiting for MinIO...';
        sleep 1;
      done;
      /usr/bin/mc mb --ignore-existing localminio/setve-bucket;
      exit 0;
      "
    networks:
      - setve-net

  # -------------------------------------------------------------
  # Real-Time Telemetry Scraper (Prometheus)
  # -------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: setve-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=1h'
    depends_on:
      - setve-orchestrator
    networks:
      - setve-net

  # -------------------------------------------------------------
  # Real-Time HDR Latency & IOPS Dashboard (Grafana)
  # -------------------------------------------------------------
  grafana:
    image: grafana/grafana:10.4.1
    container_name: setve-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - setve-net

networks:
  setve-net:
    driver: bridge

volumes:
  setve-data:
  minio-data:
