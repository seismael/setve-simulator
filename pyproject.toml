[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "setve"
version = "0.1.0"
description = "Universal Simulation & Telemetry Validation Engine"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "SETVE Architecture Team" }
]
dependencies = [
    "uvloop>=0.19.0; sys_platform != 'win32'",
    "numpy>=1.26.0",
    "liburing>=2023.9.1; sys_platform == 'linux'",
    "pydantic>=2.6.0",
    "click>=8.1.0",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "mypy>=1.8.0",
    "ruff>=0.2.0",
    "types-pyyaml>=6.0.12",
]

[project.scripts]
setve = "setve.orchestrator.master:main"

[tool.hatch.build.targets.wheel]
packages = ["setve"]

# Strict Type Checking Configuration
[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["liburing.*", "uvloop.*"]
ignore_missing_imports = true

# Fast Linter / Formatter Configuration
[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM"]
ignore = []

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
