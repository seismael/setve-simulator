[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "steve"
version = "0.2.0"
description = "STEVE: Storage, Telemetry, Engine, Verification, and Evaluation for High-Throughput Storage & Data Planes"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "STEVE Architecture Team" }
]
keywords = [
    "storage",
    "nvme",
    "io_uring",
    "simd",
    "avx-512",
    "load-testing",
    "telemetry",
    "ebpf",
    "benchmarking",
    "prometheus",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Topic :: System :: Benchmark",
    "Topic :: System :: Hardware",
    "Topic :: System :: Networking",
    "Typing :: Typed",
]
dependencies = [
    "uvloop>=0.19.0; sys_platform != 'win32'",
    "numpy>=1.26.0",
    "liburing>=2023.9.1; sys_platform == 'linux'",
    "pydantic>=2.6.0",
    "click>=8.1.0",
    "pyyaml>=6.0.1",
]

[project.urls]
Homepage = "https://github.com/seismael/steve-simulator"
Documentation = "https://github.com/seismael/steve-simulator/tree/master/docs"
Repository = "https://github.com/seismael/steve-simulator.git"
Issues = "https://github.com/seismael/steve-simulator/issues"
Changelog = "https://github.com/seismael/steve-simulator/releases"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.8.0",
    "ruff>=0.2.0",
    "types-pyyaml>=6.0.12",
]

[project.scripts]
steve = "steve.orchestrator.master:main"


[tool.hatch.build.targets.wheel]
packages = ["steve"]

# Strict Type Checking Configuration
[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["liburing.*", "uvloop.*", "kopf.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["deploy.packaging.operator.controller"]
disallow_untyped_decorators = false

# Fast Linter / Formatter Configuration
[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM"]
ignore = []

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
