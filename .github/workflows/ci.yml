name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff Lint
        run: ruff check setve/ tests/ scripts/ deploy/ usecases/

      - name: Run Mypy Strict Type Check
        run: mypy setve/ tests/ scripts/

      - name: Validate 3-Tier Enterprise Deployments
        run: python scripts/validate_deploy.py

      - name: Run Pytest Suite
        run: pytest tests/ -v
