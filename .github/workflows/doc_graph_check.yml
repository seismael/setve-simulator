name: Documentation RAG Graph Validation

on:
  push:
    paths:
      - 'docs/**'
      - 'scripts/build_doc_graph.py'
  pull_request:
    paths:
      - 'docs/**'

jobs:
  validate-graph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Rebuild Doc Graph
        run: python scripts/build_doc_graph.py

      - name: Check Uncommitted Index Changes
        run: git diff --exit-code .index/graph.json
