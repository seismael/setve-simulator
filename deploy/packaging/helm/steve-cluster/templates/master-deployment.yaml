apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "steve-cluster.fullname" . }}-master
  labels:
    {{- include "steve-cluster.labels" . | nindent 4 }}
    role: master
spec:
  replicas: {{ .Values.master.replicaCount | default 1 }}
  selector:
    matchLabels:
      {{- include "steve-cluster.labels" . | nindent 6 }}
      role: master
  template:
    metadata:
      labels:
        {{- include "steve-cluster.labels" . | nindent 8 }}
        role: master
    spec:
      containers:
        - name: master
          image: "{{ .Values.master.image.repository }}:{{ .Values.master.image.tag }}"
          imagePullPolicy: {{ .Values.master.image.pullPolicy | default "IfNotPresent" }}
          ports:
            - name: grpc-sync
              containerPort: 50051
            - name: metrics
              containerPort: 9100
          resources:
            {{- toYaml .Values.master.resources | nindent 12 }}
