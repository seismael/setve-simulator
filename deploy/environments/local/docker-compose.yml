# STEVE Local Developer Environment Compose Stack
# Reference: HLD-ENV-001 & deploy/packaging/docker/Dockerfile

services:
  steve-orchestrator:
    build:
      context: ../../..
      dockerfile: deploy/packaging/docker/Dockerfile
    container_name: steve-local-orchestrator
    cap_add:
      - SYS_ADMIN
      - SYS_NICE
    ulimits:
      memlock:
        soft: -1
        hard: -1
    environment:
      - STEVE_RUN_ID=local-compose-run-01
      - STEVE_TARGET_URI=posix:///data/scratch/target.dat
      - STEVE_DURATION_SEC=30
      - STEVE_THROUGHPUT_GBPS=10.0
      - STEVE_BLOCK_SIZE=1048576
      - STEVE_ENTROPY_RATIO=0.85
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - PROMETHEUS_METRIC_PORT=9100
    volumes:
      - steve_scratch:/data/scratch
      - /dev/shm:/dev/shm
    ports:
      - "9100:9100"
      - "50051:50051"
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - steve-local-net

  minio:
    image: minio/minio:RELEASE.2024-01-18T22-51-28Z
    container_name: steve-local-minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - steve-local-net

  prometheus:
    image: prom/prometheus:v2.49.1
    container_name: steve-local-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=1h'
    networks:
      - steve-local-net

  grafana:
    image: grafana/grafana:10.3.1
    container_name: steve-local-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - steve-local-net

volumes:
  steve_scratch:
  minio_data:

networks:
  steve-local-net:
    driver: bridge
