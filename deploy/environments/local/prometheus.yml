# Local Prometheus Scrape Configuration for SETVE Telemetry
global:
  scrape_interval: 1s
  evaluation_interval: 1s

scrape_configs:
  - job_name: "setve-master"
    static_configs:
      - targets: ["host.docker.internal:8123"]

  - job_name: "clickhouse"
    static_configs:
      - targets: ["clickhouse:8123"]
