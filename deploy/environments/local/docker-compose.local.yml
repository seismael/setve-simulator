version: "3.8"

services:
  # NATS JetStream: Local control-plane event messaging & barrier synchronization mock
  nats:
    image: nats:2.10-alpine
    container_name: setve-local-nats
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"   # Client NATS connections
      - "8222:8222"   # HTTP Monitoring Dashboard
    networks:
      - setve-local-net

  # ClickHouse: Out-of-band telemetry analytical store
  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    container_name: setve-local-clickhouse
    ports:
      - "8123:8123"   # HTTP Interface
      - "9000:9000"   # Native TCP Client Interface
    environment:
      CLICKHOUSE_DB: setve_telemetry
      CLICKHOUSE_USER: default
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    networks:
      - setve-local-net

  # Prometheus: Microsecond latency metric scraper
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: setve-local-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    networks:
      - setve-local-net

  # Grafana: Local visualization dashboards
  grafana:
    image: grafana/grafana:10.4.0
    container_name: setve-local-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - clickhouse
      - prometheus
    networks:
      - setve-local-net

networks:
  setve-local-net:
    driver: bridge

volumes:
  clickhouse_data:
  prometheus_data:
  grafana_data:
